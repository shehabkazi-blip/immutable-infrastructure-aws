---
- name: Harden Ubuntu Base Image
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install basic security and utility packages
      apt:
        name:
          - ufw
          - fail2ban
          - curl
          - git
        state: present

    - name: Enable UFW Firewall
      ufw:
        state: enabled
        policy: deny

    - name: Allow SSH through UFW
      ufw:
        rule: allow
        port: '22'
        proto: tcp
  
    - name: Start and enable Fail2ban
      service:
        name: fail2ban
        state: started
        enabled: yes
